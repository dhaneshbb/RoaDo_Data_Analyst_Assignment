[project]
name = "roado-data-analyst-assignment"
version = "0.1.0"
description = "Data Analyst Assignment for RoaDo"
authors = [{name = "dhaneshbb"}]
dependencies = [
    "insightfulpy==0.1.7",
    "pandas",
    "numpy",
    "scipy",
    "matplotlib",
    "sqlalchemy",
    "psycopg2-binary",
    "pymongo",
    "jupyter",
    "jupyterlab"
]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true
known_first_party = ["src"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
